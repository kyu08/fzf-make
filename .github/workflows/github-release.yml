# This workflow is managed by gh actions-lock.

name: GitHub Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.69.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  upload-assets:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            archive: fzf-make_${{ inputs.tag }}_linux_arm64
            os: ubuntu-latest
          - target: x86_64-unknown-linux-gnu
            archive: fzf-make_${{ inputs.tag }}_linux_amd64
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            archive: fzf-make_${{ inputs.tag }}_macos_arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: taiki-e/upload-rust-binary-action@v1.30.2
        with:
          bin: fzf-make
          target: ${{ matrix.target }}
          archive: ${{ matrix.archive }}
          ref: refs/tags/${{ inputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
