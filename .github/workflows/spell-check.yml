name: Spell Check

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  spell-check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1
    # Install the prebuilt binary instead of compiling from source (`cargo install`).
    - name: Install typos
      uses: taiki-e/install-action@v2.87.18
      with:
        tool: typos-cli@1.45.1
    - name: Spell Check
      run: |
        make spell-check
