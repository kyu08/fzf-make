# This workflow is managed by gh actions-lock.

name: Lint

on:
  push:
    branches: [ "main" ]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Setup clippy
      run: |
        rustup set profile minimal
        rustup component add clippy
    - name: Lint
      run: |
        make check
