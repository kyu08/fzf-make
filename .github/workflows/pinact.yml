name: Pinact

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Run pinact
      uses: suzuki-shunsuke/pinact-action@49cbd6acd0dbab6a6be2585d1dbdaa43b4410133 # v1.0.0
      with:
        skip_push: "true"
    - name: Show pinact fix instruction
      if: failure()
      run: |
        echo "Pinact check failed. Run 'pinact run' to pin workflow."
