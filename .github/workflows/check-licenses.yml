# This workflow is managed by gh actions-lock.

name: Check licenses
on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  check-licenses:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    # Install the prebuilt binary instead of compiling from source (`cargo install`).
    - name: Install cargo-deny
      uses: taiki-e/install-action@v2.85.7
      with:
        tool: cargo-deny@0.18.2
    - name: Check licenses
      run: |
        make check-licenses
